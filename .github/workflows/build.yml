name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Windows too: the app ships there, and path handling differs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The Studio render tests run real ffmpeg and ffprobe. apt on Linux, Chocolatey (preinstalled) on Windows.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm run typecheck
      - run: npm test

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The local-mode audio helper (game audio + mic without Overwolf). Built with the runner's Visual Studio.
      - run: npm run build:native
      - run: node scripts/verify-audio-policy.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: rc-audio
          path: native/bin/rc-audio.exe
      - run: npm run dist
      - run: node scripts/verify-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: RivalsClipper-Setup
          path: release/*.exe
      # The in-app "Check for updates" button reads the latest GitHub release. Every push to main whose
      # package.json version has no release yet publishes one (bump the version to ship an update).
      - name: Find release version
        id: ver
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $v already exists; bump package.json to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: github.event_name == 'push' && steps.ver.outputs.exists == 'false' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/RivalsClipper-Setup-*.exe
