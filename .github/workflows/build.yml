name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # Free signing/distribution routes switch on when these repo secrets exist (docs/signing.md).
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          OW_CLI_EMAIL: ${{ secrets.OW_CLI_EMAIL }}
          OW_CLI_API_KEY: ${{ secrets.OW_CLI_API_KEY }}
          OW_BUILD_KEY: ${{ secrets.OW_BUILD_KEY }}
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
      - name: Report signature status of every shipped binary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter *.exe) + @(Get-ChildItem release/win-unpacked -Recurse -Include *.exe,*.dll,*.node)
          $rows = foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            [pscustomobject]@{ File = $f.FullName.Replace("$PWD\", ''); Status = $sig.Status; Signer = $sig.SignerCertificate.Subject }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 300 | Write-Output
          $unsigned = @($rows | Where-Object { $_.Status -ne 'Valid' })
          "## Signature report" >> $env:GITHUB_STEP_SUMMARY
          "$($files.Count) binaries, $($unsigned.Count) not validly signed" >> $env:GITHUB_STEP_SUMMARY
          $unsigned | ForEach-Object { "- $($_.File): $($_.Status)" } >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: RivalsClipper-Setup
          path: |
            release/*.exe
            release/*.appx
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.appx
